# Optional: `make dev` is the faster loop. This exists for a reproducible run.
services:
  backend:
    image: python:3.12-slim
    working_dir: /srv
    command: >
      bash -lc "pip install -q -e '.[dev]' &&
                python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/srv
    environment:
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"

  frontend:
    image: node:22-slim
    working_dir: /srv
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/srv
      - /srv/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
