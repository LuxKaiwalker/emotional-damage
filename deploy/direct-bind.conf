# Drop-in: expose uvicorn directly, no nginx.
#
# For a backend-only box, where the UI runs from a dev server on someone's laptop
# (`BACKEND_URL=http://<ip>:8000 npm run dev`) and the browser only ever talks to
# localhost. Nothing needs TLS in that setup, because the secure context that
# getUserMedia requires comes from localhost, not from this host.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/ed-backend.service.d
#   sudo cp deploy/direct-bind.conf /etc/systemd/system/ed-backend.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ed-backend
#
# Remove it (and reload) to go back to 127.0.0.1 behind nginx.
#
# Still one worker: state is in-process. And still no auth -- player_id is an
# opaque id, not a credential, so an open :8000 is for a LAN or a short-lived
# demo box, not for leaving up.

[Service]
# The empty assignment is required: it clears the unit's ExecStart before
# replacing it, instead of appending a second command.
ExecStart=
ExecStart=/srv/emotional-damage/backend/.venv/bin/python -m uvicorn app.main:app \
          --host 0.0.0.0 --port 8000 --workers 1
