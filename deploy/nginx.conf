# emotional-damage: static bundle + API on ONE origin.
#
# Single origin is deliberate. api/client.ts defaults to a relative "/api" and
# useGameSocket.ts derives wss://<this host>/ws, so serving both from here means no
# VITE_* build vars, no CORS, and no mixed content to debug.
#
# This is the plain-HTTP vhost. Run `certbot --nginx -d <domain>` after installing it;
# certbot rewrites this file in place to add TLS and the :80 -> :443 redirect.
#
# HTTPS is not optional here: getUserMedia needs a secure context, so over plain HTTP
# on anything but localhost the camera silently fails and no frames are ever captured.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /srv/emotional-damage/frontend/dist;
    index index.html;

    # MAX_FRAME_BYTES is 2 MiB; leave headroom for the multipart envelope.
    client_max_body_size 4m;

    access_log /var/log/nginx/emotional-damage.access.log;
    error_log  /var/log/nginx/emotional-damage.error.log;

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter owns the client-side paths: unknown ones must serve index.html,
    # or a reload on /room/ABCD is a 404.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream frame uploads straight through instead of spooling them to disk first.
        proxy_request_buffering off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The state channel is quiet between rounds; nginx's 60s default would close it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: the SmartSpectra sidecar. An HTTPS page cannot open ws://localhost:3001
    # (mixed content), so it has to come through here as wss://<domain>/spectra.
    location /spectra/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # verifyClient string-matches this against WEB_ORIGIN.
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
